name: App checks
on:
  pull_request:
  push:
    branches: [main, feat/sonstige-bankeinnahmen]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript and application regressions
        run: |
          node --check sync.js
          node --check qonto.js
          node --check sonstige-einnahmen.js
          node tests/auth.cjs
          node tests/app-smoke.cjs
          node tests/qonto-private.cjs
          node tests/qonto-edge.cjs
          node tests/private-sync.cjs
      - name: Isolated PostgreSQL regression dependency
        run: npm install --prefix "$RUNNER_TEMP/bank-db" @electric-sql/pglite@0.3.14 --no-audit --no-fund
      - name: Bank income SQL and permissions
        env:
          PG_TEST_MODULE: ${{ runner.temp }}/bank-db/node_modules/@electric-sql/pglite
        run: node tests/bank-income-db.cjs
